name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is supported for consumers of the published package, but the dev
        # toolchain cannot run on it: @strapi/sdk-plugin pulls concurrently@10,
        # which requires Node >= 22.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint:ts

      - run: yarn test:ts

      - run: yarn build

      - run: yarn verify
